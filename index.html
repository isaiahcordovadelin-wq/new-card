<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5ed">
  <title>People Index | Profile Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,500,20,1&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #202b24;
      --muted: #68736c;
      --paper: #f2f5ed;
      --green: #204b39;
      --lime: #ddff63;
      --coral: #ef7657;
      --blue: #5368d6;
      --line: #dce3d9;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 0 34px 64px;
      background-color: var(--paper);
      background-image: radial-gradient(#d3dbd0 0.7px, transparent 0.7px);
      background-size: 18px 18px;
    }

    .site-shell { width: min(100%, 1120px); margin: 0 auto; }

    .site-header {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #d4ddd2;
    }

    .brand { display: flex; align-items: center; gap: 11px; }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: var(--lime);
      font-size: 12px;
      font-weight: 700;
    }

    .brand-copy { display: grid; gap: 2px; text-align: left; }
    .brand-name { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .brand-subtitle { color: var(--muted); font-size: 9px; letter-spacing: 1px; }

    .header-location {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .header-mark { width: 8px; height: 8px; background: var(--coral); transform: rotate(45deg); }

    main { width: 100%; }

    .hero {
      min-height: 405px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.8fr);
      align-items: center;
      gap: 9%;
      padding: 56px 5.5% 50px;
    }

    .eyebrow {
      margin: 0 0 19px;
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 58px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.02;
    }

    h1 em {
      color: var(--green);
      font-family: "Fraunces", Georgia, serif;
      font-weight: 500;
    }

    .intro {
      max-width: 390px;
      margin: 19px 0 25px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .reveal-button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 50px;
      padding: 0 17px;
      border: 0;
      border-radius: 3px;
      background: var(--green);
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .reveal-button:hover { background: #173c2b; transform: translateY(-2px); }
    .reveal-button:focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }

    .button-icon {
      width: 21px;
      height: 21px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--lime);
      color: var(--ink);
      font-size: 16px;
      line-height: 1;
    }

    .hero-art {
      position: relative;
      width: min(100%, 390px);
      aspect-ratio: 1.2;
      justify-self: end;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 21px;
      background: var(--coral);
      color: #fffefa;
    }

    .hero-art::before {
      position: absolute;
      top: 57px;
      right: 22px;
      width: 68px;
      height: 68px;
      border: 1px solid rgb(255 254 250 / 68%);
      content: "";
    }

    .hero-art::after {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 36%;
      height: 15px;
      background: var(--lime);
      content: "";
    }

    .art-top, .art-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .art-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 82px;
      height: 82px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      transform: translate(-50%, -50%) rotate(-8deg);
    }

    .art-mark span { background: var(--lime); }
    .art-mark span:nth-child(2), .art-mark span:nth-child(3) { background: #fffefa; }

    .collection { padding: 28px 5.5% 0; border-top: 1px solid #d4ddd2; }

    .collection-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }

    .collection .eyebrow { margin-bottom: 6px; }
    h2 { margin: 0; font-size: 25px; line-height: 1.25; }

    .collection-count {
      padding: 7px 10px;
      border: 1px solid #d4ddd2;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .profile-card {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fffefa;
      box-shadow: 0 8px 20px rgb(32 43 36 / 5%);
      animation: appear 220ms ease-out both;
    }

    .profiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

    .profile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 19px;
    }

    .profile-number { margin: 0; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 1px; }

    .location {
      max-width: 65%;
      overflow: hidden;
      padding: 5px 8px;
      background: #edf2e8;
      color: var(--green);
      font-size: 10px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-body { display: flex; align-items: flex-start; gap: 14px; }

    .avatar {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      background: var(--avatar-color, var(--lime));
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
    }

    .profile-copy { min-width: 0; }
    .profile-name { margin: 0; font-size: 19px; line-height: 1.2; overflow-wrap: anywhere; }
    .bio { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .empty-state { grid-column: 1 / -1; padding: 27px 18px; border: 1px dashed #c9d3c8; color: var(--muted); font-size: 13px; text-align: center; }
    .empty-symbol { display: block; margin-bottom: 8px; color: var(--green); font-size: 22px; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      body { padding: 0 20px 42px; }
      .hero { min-height: auto; grid-template-columns: 1fr; gap: 34px; padding: 50px 2px 38px; }
      .hero-art { width: min(100%, 500px); aspect-ratio: 1.45; justify-self: center; }
      .collection { padding-inline: 2px; }
      .profiles { grid-template-columns: 1fr; }
    }

    @media (max-width: 420px) {
      h1 { font-size: 43px; }
      .header-location { font-size: 9px; }
      .profile-card { padding: 16px; }
      .profile-body { gap: 11px; }
      .avatar { width: 44px; height: 44px; flex-basis: 44px; font-size: 13px; }
      .profile-name { font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">PI</span>
        <span class="brand-copy"><span class="brand-name">PEOPLE INDEX</span><span class="brand-subtitle">PROFILE GENERATOR</span></span>
      </div>
      <span class="header-location"><span class="header-mark" aria-hidden="true"></span>PHILIPPINES</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">A RANDOM PROFILE GENERATOR</p>
          <h1 id="page-title">New faces.<br><em>Fresh perspectives.</em></h1>
          <p class="intro">A growing collection of people, ideas, and places from the Philippines.</p>
          <button class="reveal-button" id="profile-toggle" type="button" aria-controls="profiles">
            <span class="button-label">Add a profile</span>
            <span class="button-icon" aria-hidden="true">+</span>
          </button>
        </div>

        <div class="hero-art" aria-hidden="true">
          <div class="art-top"><span>PEOPLE / PH</span><span>VOL. 01</span></div>
          <span class="art-mark"><span></span><span></span><span></span><span></span></span>
          <div class="art-bottom"><span>Every story starts somewhere</span><span>✳</span></div>
        </div>
      </section>

      <section class="collection" aria-labelledby="collection-title">
        <div class="collection-head">
          <div><p class="eyebrow">THE DIRECTORY</p><h2 id="collection-title">Profiles</h2></div>
          <span class="collection-count" id="profile-count">0 profiles</span>
        </div>
        <div class="profiles" id="profiles" aria-label="Added profiles" aria-live="polite">
          <div class="empty-state" id="empty-state"><span class="empty-symbol" aria-hidden="true">+</span>No profiles yet</div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
