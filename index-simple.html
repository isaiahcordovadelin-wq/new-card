<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>Profile reveal</title>
  <style>
    :root {
      font-family: "DM Sans", sans-serif;
      color: #25342b;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #f3f5f1;
    }

    main { width: min(100%, 460px); text-align: center; }
    h1 { margin: 0 0 10px; font-size: 32px; }
    .intro { margin: 0 0 22px; color: #627067; }

    .reveal-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: #315b43;
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .reveal-button:hover { background: #244632; }
    .reveal-button:focus-visible { outline: 3px solid #ef7853; outline-offset: 3px; }
    .button-icon { font-size: 18px; line-height: 1; }

    .profile-card {
      width: 100%;
      margin: 0;
      padding: 24px;
      border: 1px solid #dfe5dd;
      border-radius: 8px;
      background: white;
      box-shadow: 0 8px 24px rgb(37 52 43 / 7%);
    }

    .profiles { display: grid; gap: 16px; margin-top: 20px; }
    .profile-number { margin: 0 0 12px; color: #627067; font-size: 12px; font-weight: 700; }

    .avatar {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #e4efdf;
      color: #315b43;
      font-size: 20px;
      font-weight: 700;
    }

    h2 { margin: 0; font-size: 22px; line-height: 1.35; }
    .bio { margin: 10px 0 0; color: #627067; line-height: 1.6; }
    .location { margin: 16px 0 0; font-size: 14px; font-weight: 600; }

  </style>
</head>
<body>
  <main>
    <h1>My Profile</h1>
    <p class="intro">Click below to add a profile.</p>

    <button class="reveal-button" id="profile-toggle" type="button" aria-controls="profiles">
      <span class="button-label">Add profile</span>
      <span class="button-icon" aria-hidden="true">+</span>
    </button>

    <section class="profiles" id="profiles" aria-label="Added profiles" aria-live="polite"></section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
